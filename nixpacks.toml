[phases.setup]
nixPkgs = ["python310", "nodejs-18_x"]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    "python -m pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
    "cd frontend && npm install && npm run build"
]

[start]
cmd = "cd backend && python app.py"

